<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Presensi Toko - Kang Jus</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .poster-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px 28px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 3px solid #229f42;
      text-align: center;
      box-sizing: border-box;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #229f42;
      margin: 0 0 4px 0;
    }
    .brand-title span {
      color: #f48020;
    }
    .brand-sub {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 20px 0;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .qr-frame {
      background: #f8fafc;
      padding: 16px;
      border-radius: 16px;
      border: 2px dashed #cbd5e1;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-frame img {
      width: 230px;
      height: 230px;
      display: block;
    }
    .instruction {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .instruction-sub {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
      margin: 0 0 24px 0;
    }
    .badge-code {
      display: inline-block;
      background: #e8f7ec;
      color: #16a34a;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .btn-print {
      margin-top: 20px;
      background: #229f42;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 159, 66, 0.3);
    }
    @media print {
      body { background: #fff; padding: 0; }
      .btn-print { display: none; }
      .poster-card { box-shadow: none; border-width: 2px; }
    }
  </style>
</head>
<body>

  <div class="poster-card">
    <h1 class="brand-title">KANG <span>JUS</span></h1>
    <p class="brand-sub">Titik Presensi Resmi Outlet</p>

    <div class="qr-frame">
      <!-- QR code dengan isi kode statis: KANGJUS-OUTLET-PRESENSI-OFFICIAL -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=KANGJUS-OUTLET-PRESENSI-OFFICIAL" alt="QR Code Toko Kang Jus">
    </div>

    <div class="instruction">Scan untuk Absen Masuk & Pulang</div>
    <p class="instruction-sub">Pastikan berada di outlet toko saat melakukan presensi kedatangan dan kepulangan shift.</p>

    <div class="badge-code">KODE TOKO: KANGJUS-OUTLET-PRESENSI-OFFICIAL</div>
  </div>

  <button class="btn-print" onclick="window.print()">Cetak Lembar QR Toko Ini</button>

</body>
</html>
